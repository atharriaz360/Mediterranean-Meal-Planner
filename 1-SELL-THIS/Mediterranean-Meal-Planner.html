:root{
 --primary:#1D5673;--primary-deep:#143F55;--sun:#F2B84B;--terra:#D9683A;--olive:#6E7B3A;
 --bg:#FAF6EF;--surface:#FFFFFF;--surface-2:#F4EEE3;--line:#E8E0D2;--text:#1E2A30;--muted:#66727A;
 --ok:#3F8A5F;--warn:#C58A1E;--bad:#C0473A;
 --tint:color-mix(in srgb,var(--primary) 9%,var(--surface));--tint-2:color-mix(in srgb,var(--primary) 16%,var(--surface));
 --accent-text:var(--primary);
 --radius:18px;--radius-sm:12px;--shadow:0 1px 2px rgba(30,42,48,.04),0 8px 24px rgba(30,42,48,.06);--shadow-lg:0 24px 70px rgba(15,26,32,.22);
 --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --side:264px;color-scheme:light
}
[data-theme=dark]{
 --bg:#0E181D;--surface:#15222A;--surface-2:#1B2B34;--line:#26363F;--text:#E8EEF0;--muted:#98A6AD;
 --tint:color-mix(in srgb,var(--primary) 22%,var(--surface));--tint-2:color-mix(in srgb,var(--primary) 34%,var(--surface));
 --accent-text:color-mix(in srgb,var(--primary) 45%,#ffffff);
 --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.22);color-scheme:dark
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}

/* ---------- layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;text-decoration:none;color:inherit}
.brand svg.mark{width:42px;height:42px;flex:0 0 42px;border-radius:12px}
.brand .wm{height:22px;width:auto;fill:var(--text)}
.brand small{display:block;font-size:9.5px;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:11px;color:var(--muted);font-size:14px;text-align:left;min-height:40px}
.nav button svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.active{background:var(--tint);color:var(--accent-text);font-weight:650}
.nav .count{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 8px;font-weight:600}
.nav button.active .count{background:var(--surface);color:var(--accent-text)}
.side-foot{border-top:1px solid var(--line);padding:12px 8px 0;margin-top:10px;font-size:12px;color:var(--muted);display:grid;gap:8px}
.save-state{display:flex;align-items:center;gap:7px}
.save-state i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save-state.warn i{background:var(--warn)}.save-state.bad i{background:var(--bad)}
.main{margin-left:var(--side);min-width:0}
.topbar{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:12px;padding:0 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.btn.menu-btn{display:none}
.search{position:relative;flex:1;max-width:480px}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 44px 0 40px;outline:0}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.search>svg{position:absolute;left:13px;top:12px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:10px;top:10px;font:600 11px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface-2)}
.search-results{position:absolute;top:48px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:60vh;overflow:auto;padding:6px;display:none}
.search-results.open{display:block}
.search-results button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px}
.search-results button:hover,.search-results button.hl{background:var(--tint)}
.search-results small{color:var(--muted);margin-left:auto;font-size:11.5px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:26px 28px 60px;max-width:1440px;margin:0 auto}
.page{display:none;animation:fade .22s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line));background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;font-size:17px}
.card-h .link{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:13px;padding:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.mt{margin-top:16px}.mt-l{margin-top:24px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:32px;line-height:1.1}
.page-h p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:650;white-space:nowrap}
.pill.p{background:var(--tint);color:var(--accent-text)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--primary);transition:width .4s ease}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.6;display:block;margin:0 auto 8px}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-size:17px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted)}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--surface);transition:.15s;margin:0}
.chk:checked{background:var(--primary);border-color:var(--primary)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.segmented button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--tint);border-color:color-mix(in srgb,var(--primary) 35%,var(--line));color:var(--accent-text)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.input,.field input,.field select,.field textarea,.toolbar input,.toolbar select{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;outline:0;width:100%}
.field textarea{height:auto;padding:10px 12px;resize:vertical;min-height:90px;line-height:1.5}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.toolbar input{max-width:280px}
.toolbar select{width:auto;min-width:150px}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:12.5px;font-weight:650;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:0 0 44px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--muted) 35%,var(--surface-2));transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2.5px solid var(--primary);outline-offset:2px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl b{display:block;font-weight:600}
.set-row .lbl span{font-size:12.5px;color:var(--muted)}
.set-row select,.set-row input[type=number],.set-row input[type=text]{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;max-width:190px}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--text)}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px;box-shadow:var(--shadow)}
.banner .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;background:var(--tint);color:var(--accent-text)}
.banner .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.banner .grow{flex:1;font-size:13.5px}
.banner b{display:block;font-size:14px}
.banner.warn .ic{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}

/* ---------- dashboard ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;color:#fff;background:linear-gradient(120deg,var(--primary-deep),var(--primary) 70%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 55%,transparent 56%);opacity:.9}
.hero .sprig{position:absolute;right:30px;top:18px;width:190px;height:190px;z-index:1;opacity:.95}
.hero-in{position:relative;z-index:2;max-width:640px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:34px;margin:6px 0 8px;line-height:1.1}
.hero p{margin:0;opacity:.85;max-width:520px}
.hero .actions{margin-top:18px}
.hero .btn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.2)}
.hero .btn.solid{background:#fff;color:var(--primary-deep);border-color:#fff}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.stat .k svg{width:16px;height:16px;stroke:var(--accent-text);fill:none;stroke-width:2}
.stat .v{font-family:var(--serif);font-size:30px;line-height:1.1}
.stat .v small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}
.stat .bar{margin-top:6px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slot{border:1px dashed var(--line);border-radius:14px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.slot.has{border-style:solid;background:var(--surface)}
.slot .sl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.slot .add{margin-top:auto;border:0;background:var(--surface-2);border-radius:9px;padding:7px;color:var(--muted);font-weight:600;font-size:13px}
.slot .add:hover{background:var(--tint);color:var(--accent-text)}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{fill:var(--muted);font:11px var(--sans)}
.svgchart .gl{stroke:var(--line)}

/* ---------- meal chips / week grid ---------- */
.meal{display:flex;gap:9px;align-items:center;padding:7px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;text-align:left;width:100%;cursor:pointer;min-width:0}
.meal:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--line))}
.meal .th{width:38px;height:38px;border-radius:9px;flex:0 0 38px;object-fit:cover;background:var(--line)}
.meal .mt-t{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meal .mt-s{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
.meal.eaten{opacity:.7}
.meal.eaten .mt-t::before{content:"✓ ";color:var(--ok)}
.gdots{display:inline-flex;gap:3px;margin-left:2px}
.gdots i{width:6px;height:6px;border-radius:50%;display:inline-block}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav strong{font-family:var(--serif);font-size:18px;min-width:210px;text-align:center}
.week{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.week>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;min-width:0}
.week>div:nth-child(8n){border-right:0}
.week .wh{background:var(--surface-2);text-align:center;padding:10px 6px}
.week .wh b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.week .wh span{font-family:var(--serif);font-size:22px}
.week .wh.today{background:var(--tint)}
.week .wh.today span{color:var(--accent-text)}
.week .ws{display:flex;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);background:var(--surface-2)}
.week .wc{display:flex;flex-direction:column;gap:6px;min-height:104px}
.week .wc.today{background:color-mix(in srgb,var(--primary) 4%,var(--surface))}
.week .wc .plus{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:9px;color:var(--muted);height:30px;font-size:18px;line-height:1;opacity:.55;transition:.15s}
.week .wc:hover .plus,.week .wc .plus:focus{opacity:1;border-color:var(--primary);color:var(--accent-text)}
.week .wt{font-size:12px;color:var(--muted);text-align:center;background:var(--surface-2);border-bottom:0}
.week .wt b{color:var(--text)}
.week>.corner{background:var(--surface-2)}
.week .meal{padding:7px 8px;border-left:3px solid var(--slot,var(--primary));border-radius:9px}
.week .meal .th{display:none}
.week .meal .mt-t{-webkit-line-clamp:3}
.wlist{display:none}

/* ---------- recipes ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
.rcard{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;border:1px solid var(--line)}
.rcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(30,42,48,.12)}
.rcard .img{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.rcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard h3{margin:0;font-size:18px;line-height:1.2}
.rcard .meta{display:flex;gap:10px;color:var(--muted);font-size:12.5px;align-items:center;flex-wrap:wrap}
.rwrap .fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#9aa3a8;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.rwrap .fav.on{color:var(--terra)}
.rwrap .fav svg{width:17px;height:17px;fill:currentColor}
.rwrap{position:relative;height:100%}
.rwrap .rcard{height:100%}
.rdetail .img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block;background:var(--surface-2)}
.rdetail h4{font-family:var(--serif);font-size:17px;margin:18px 0 8px}
.rdetail ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.rdetail ul li{display:flex;gap:9px;align-items:flex-start}
.rdetail ul li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--olive);margin-top:7px;flex:0 0 7px}
.rdetail ol{margin:0;padding-left:20px;display:grid;gap:8px}
.rdetail .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- shopping ---------- */
.aisle{margin-bottom:6px}
.aisle h4{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.aisle h4 .n{font-weight:500}
.addbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;margin-bottom:6px}
.addbar input,.addbar select{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;outline:0;width:100%}
.addbar input:focus,.addbar select:focus{border-color:var(--primary)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}

/* ---------- today / water ---------- */
.glasses{display:flex;flex-wrap:wrap;gap:8px}
.glass{width:38px;height:48px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.glass .fill{fill:var(--tint-2);transition:.2s}
.glass.on .fill{fill:#4FA3C7}
.glass .outline{fill:none;stroke:color-mix(in srgb,var(--muted) 60%,transparent);stroke-width:2}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:0 0 120px}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--serif);font-size:24px;line-height:1}
.ring small{font-size:11px;color:var(--muted)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cal>div:nth-child(7n){border-right:0}
.cal .ch{padding:9px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);background:var(--surface-2)}
.cal .cd{min-height:108px;padding:7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit}
.cal .cd:hover{background:var(--surface-2)}
.cal .cd.out{opacity:.4}
.cal .cd .n{font-size:13px;font-weight:650;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .cd.today .n{background:var(--primary);color:#fff}
.cal .ev{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--primary)}
.cal .ev.task{border-left-color:var(--terra)}
.cal .more{font-size:11px;color:var(--muted);padding-left:4px}

/* ---------- notes ---------- */
.ngrid{columns:3 260px;column-gap:16px}
.note{break-inside:avoid;margin-bottom:16px;cursor:pointer;position:relative}
.note h3{margin:0 0 6px;font-size:17px;padding-right:24px}
.note p{margin:0;white-space:pre-wrap;color:color-mix(in srgb,var(--text) 85%,var(--muted));font-size:14px}
.note .pin{position:absolute;top:16px;right:16px;color:var(--terra)}
.note .pin svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.note small{display:block;margin-top:10px;color:var(--muted);font-size:11.5px}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,18,22,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex;animation:fade .15s ease}
.modal{width:min(640px,100%);max-height:min(88vh,900px);background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.modal.narrow{width:min(440px,100%)}
.m-h{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.m-h h2{margin:0;font-size:21px;flex:1}
.m-b{padding:4px 20px 20px;overflow:auto}
.m-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.m-f .left{margin-right:auto}
.toasts{position:fixed;z-index:200;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#1E2A30;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;animation:up .2s ease;max-width:min(520px,calc(100vw - 32px))}
[data-theme=dark] .toast{background:#E8EEF0;color:#12202A}
.toast.err{background:var(--bad);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:8px;padding:4px 10px;font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.imgdrop{display:flex;gap:12px;align-items:center}
.imgdrop img{width:84px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.onb{text-align:center;padding:10px 6px 4px}
.onb svg.big{width:84px;height:84px;border-radius:22px;margin:0 auto 12px;display:block}
.onb h2{font-size:28px;margin:0 0 6px}
.onb p{color:var(--muted);margin:0 auto 16px;max-width:420px}
.tips{display:grid;gap:10px;text-align:left;margin:6px 0 4px}
.tips div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.tips svg{width:20px;height:20px;flex:0 0 20px;stroke:var(--accent-text);fill:none;stroke-width:2;margin-top:1px}
.steps{display:flex;gap:6px;justify-content:center;margin-top:14px}
.steps i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:.2s}
.steps i.on{width:22px;background:var(--primary)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;text-align:left}
.choice button.on{border-color:var(--primary);background:var(--tint)}
.choice b{display:block;margin-bottom:3px}
.choice span{font-size:12.5px;color:var(--muted)}

.bottom-nav{display:none}
.print-only{display:none}
#printRecipe{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){
 .week{display:none}.wlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
}
@media (max-width:860px){
 :root{--side:280px}
 .sidebar{transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
 .sidebar.open{transform:none}
 .scrim{position:fixed;inset:0;background:rgba(10,18,22,.4);z-index:35;display:none}
 .scrim.open{display:block}
 .main{margin-left:0}
 .btn.menu-btn{display:inline-flex}
 .topbar{padding:0 12px;height:62px}
 .search kbd,.hide-sm{display:none}
 .content{padding:18px 14px calc(92px + env(safe-area-inset-bottom))}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .banner{flex-wrap:wrap}.banner .grow{flex:1 1 200px}
 .page-h h1{font-size:27px}
 .hero{padding:22px 20px}.hero h2{font-size:27px}.hero::after{width:170px;height:170px;right:-70px;top:-70px;opacity:.5}.hero .sprig{width:130px;height:130px;right:-10px;top:-6px;opacity:.5}
 .form{grid-template-columns:1fr}
 .addbar{grid-template-columns:1fr 1fr}
 .addbar .btn{grid-column:1/-1}
 .toolbar input{max-width:none;flex:1 1 100%}
 .toolbar select{flex:1}
 .cal .cd{min-height:64px;padding:4px}
 .cal .ev{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--primary);border-radius:3px}
 .cal .ev.task{background:var(--terra)}
 .cal .more{display:none}
 .bottom-nav{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bottom-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
 .bottom-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .bottom-nav button.active{color:var(--accent-text)}
 .toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
 .modal{max-height:92vh;border-radius:20px}
 .overlay{align-items:flex-end;padding:0}
 .overlay .modal{border-radius:22px 22px 0 0;width:100%;max-height:94vh}
 .m-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
 .choice{grid-template-columns:1fr}
 .week-nav strong{min-width:0;font-size:16px}
}

/* ---------------- storage: IndexedDB → localStorage → memory ---------------- */
const Store={
 mode:'memory',db:null,
 async init(){
  try{
   if(!('indexedDB' in window))throw 0;
   this.db=await new Promise((res,rej)=>{const t=setTimeout(()=>rej('timeout'),2500);const q=indexedDB.open('mediterranean-meal-planner-planner',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{clearTimeout(t);res(q.result)};q.onerror=()=>{clearTimeout(t);rej(q.error)};q.onblocked=()=>{clearTimeout(t);rej('blocked')}});
   await this.idbSet('__probe',1);this.mode='idb';return;
  }catch(e){this.db=null}
  try{localStorage.setItem('__olv_probe','1');localStorage.removeItem('__olv_probe');this.mode='local'}catch(e){this.mode='memory'}
 },
 idbSet(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('aborted'))})},
 idbGet(k){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readonly');const q=tx.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},

  try{const raw=localStorage.getItem('mediterranean-meal-planner:'+k);if(raw)return JSON.parse(raw)}catch(e){}
  return undefined;
 },
 async set(k,v){
  if(this.mode==='idb'){await this.idbSet(k,v);return true}

async function compressImage(file,max=1000,q=.8){
 if(!file)return '';
 if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name))throw new Error('Please choose an image file.');
 if(file.size>25*1024*1024)throw new Error('That photo is over 25 MB. Please pick a smaller one.');
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('This photo format isn’t supported by your browser. Try a JPG or PNG.'));i.src=url});
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
 }finally{URL.revokeObjectURL(url)}
}

function normalize(x){

 o.ui=Object.assign(blankState().ui,x?.ui||{});
 for(const k of COLLECTIONS)if(!Array.isArray(o[k]))o[k]=[];
 if(!o.water||typeof o.water!=='object')o.water={};
 o.meals.forEach(m=>{if(!Array.isArray(m.groups))m.groups=[];if(!SLOTS.includes(m.slot))m.slot='Dinner'});
 o.recipes.forEach(r=>{if(!Array.isArray(r.groups))r.groups=[];if(!Array.isArray(r.ingredients))r.ingredients=String(r.ingredients||'').split('\n').filter(Boolean)});
 o.shopping.forEach(i=>{if(!AISLES.includes(i.aisle))i.aisle=guessAisle(i.name||'')});
 o.version=2;o.app='mediterranean-meal-planner';
 return o;
}

/* ---------------- global search ---------------- */
let searchHits=[],searchIdx=-1;
function runSearch(q){
 q=q.trim().toLowerCase();const box=$('#searchResults');
 if(!q){box.classList.remove('open');box.innerHTML='';searchHits=[];return}
 const hits=[];const push=(page,type,rec,title,sub)=>hits.push({page,type,id:rec.id,title,sub});
 state.recipes.forEach(r=>{if(`${r.title} ${r.tags} ${r.ingredients.join(' ')}`.toLowerCase().includes(q))push('recipes','recipe',r,r.title,'Recipe')});
 state.meals.forEach(m=>{if(m.title.toLowerCase().includes(q))push('week','meal',m,m.title,`${m.slot} · ${relDay(m.date)}`)});
 state.shopping.forEach(i=>{if(i.name.toLowerCase().includes(q))push('shopping','shop',i,i.name,i.done?'Shopping · bought':'Shopping')});
 state.pantry.forEach(i=>{if(i.name.toLowerCase().includes(q))push('pantry','pantry',i,i.name,'Pantry')});
 state.tasks.forEach(i=>{if(i.title.toLowerCase().includes(q))push('prep','task',i,i.title,'Prep list')});
 state.goals.forEach(i=>{if(i.title.toLowerCase().includes(q))push('goals','goal',i,i.title,'Goal')});
 state.notes.forEach(i=>{if(`${i.title} ${i.text}`.toLowerCase().includes(q))push('journal','note',i,i.title,'Journal')});
 searchHits=hits.slice(0,12);searchIdx=searchHits.length?0:-1;
 box.innerHTML=searchHits.length?searchHits.map((h,i)=>`<button role="option" data-hit="${i}" class="${i===0?'hl':''}"><span>${esc(h.title)}</span><small>${esc(h.sub)}</small></button>`).join(''):`<div class="empty" style="padding:18px">No matches for “${esc(q)}”</div>`;
 box.classList.add('open');
}
function openHit(h){
 $('#searchResults').classList.remove('open');$('#search').value='';$('#search').blur();
 if(h.type==='meal'){const m=state.meals.find(x=>x.id===h.id);if(m){state.ui.weekOffset=weekOffsetFor(m.date)}}
 go(h.page);
 setTimeout(()=>{({recipe:()=>recipeDetail(h.id),meal:()=>mealModal({id:h.id}),shop:()=>shopModal(h.id),pantry:()=>pantryModal(h.id),task:()=>taskModal(h.id),goal:()=>goalModal(h.id),note:()=>noteModal(h.id)})[h.type]?.()},60);
}
$('#search').addEventListener('input',e=>runSearch(e.target.value));
$('#search').addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!searchHits.length)return;searchIdx=(searchIdx+(e.key==='ArrowDown'?1:-1)+searchHits.length)%searchHits.length;$$('#searchResults button').forEach((b,i)=>b.classList.toggle('hl',i===searchIdx))}
 else if(e.key==='Enter'&&searchHits[searchIdx]){e.preventDefault();openHit(searchHits[searchIdx])}
 else if(e.key==='Escape'){e.target.value='';runSearch('');e.target.blur()}
});
$('#searchResults').addEventListener('mousedown',e=>{const b=e.target.closest('[data-hit]');if(b){e.preventDefault();openHit(searchHits[+b.dataset.hit])}});
$('#search').addEventListener('blur',()=>setTimeout(()=>$('#searchResults').classList.remove('open'),120));
$('#searchKbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘K':'Ctrl K';

 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();return}
 const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||$('#overlay').classList.contains('open');

/* ---------------- shared calculations ---------------- */
const curWeekStart=()=>addDays(weekStartOf(today(),state.settings.weekStart),state.ui.weekOffset*7);
const weekOffsetFor=date=>Math.round((parse(weekStartOf(date,state.settings.weekStart))-parse(weekStartOf(today(),state.settings.weekStart)))/(7*864e5));
const mealsOn=d=>state.meals.filter(m=>m.date===d).sort((a,b)=>SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot));
const weekMeals=start=>{const end=addDays(start,6);return state.meals.filter(m=>m.date>=start&&m.date<=end)};
const kcal=n=>state.settings.showCalories&&+n?`${Math.round(+n)} kcal`:'';
function weekLabel(start){const a=parse(start),b=parse(addDays(start,6));const same=a.getMonth()===b.getMonth();return `${a.toLocaleDateString(undefined,{day:'numeric',month:same?undefined:'short'})} – ${b.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`}
function balance(meals){
 const tally=Object.fromEntries(GROUPS.map(g=>[g.k,0]));meals.forEach(m=>(m.groups||[]).forEach(k=>{if(k in tally)tally[k]++}));
 const main=meals.filter(m=>m.slot!=='Snack');
 const plant=meals.length?Math.round(meals.filter(m=>(m.groups||[]).some(k=>['veg','legumes','fruit','grains','nuts'].includes(k))&&!(m.groups||[]).includes('redmeat')).length/meals.length*100):0;
 return {tally,plant,total:meals.length,main:main.length};
}
function svgBars(labels,stacks,colors,{h=200,unit=''}={}){
 const W=560,pad=42,base=h-26,top=14,max=Math.max(1,...stacks.map(s=>s.reduce((a,b)=>a+b,0)));
 const bw=(W-pad*2)/labels.length,w=Math.min(34,bw*.5);
 let g='';for(let i=0;i<=3;i++){const y=base-(base-top)*i/3;g+=`<line class="gl" x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}"/>`;if(i)g+=`<text x="${pad-6}" y="${y+4}" text-anchor="end">${(v=>v>=10000?Math.round(v/1000)+'k':v>=1000?(v/1000).toFixed(1)+'k':v)(Math.round(max*i/3))}</text>`}
 labels.forEach((l,i)=>{let y=base;const x=pad+bw*i+bw/2-w/2;stacks[i].forEach((v,j)=>{if(!v)return;const hh=(base-top)*v/max;y-=hh;g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(hh-1.5,1)}" rx="4" fill="${colors[j]}"><title>${esc(l.t)}: ${v}${unit}</title></rect>`});g+=`<text x="${x+w/2}" y="${h-7}" text-anchor="middle" style="${l.today?'fill:var(--accent-text);font-weight:700':''}">${esc(l.s)}</text>`});
 return `<svg class="svgchart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Chart">${g}</svg>`;
}
const legend=items=>`<div class="row" style="flex-wrap:wrap;gap:14px;margin-top:8px">${items.map(([l,c])=>`<span class="row small muted" style="gap:6px"><span class="dot" style="background:${c}"></span>${l}</span>`).join('')}</div>`;
function mealChip(m){return `<button class="meal ${m.status==='Eaten'?'eaten':''}" style="--slot:${SLOT_COLOR[m.slot]}" data-meal="${m.id}"><img class="th" src="${mealImg(m)}" alt=""><span style="min-width:0"><span class="mt-t">${esc(m.title)}</span><span class="mt-s">${kcal(m.calories)}${gdots(m.groups)}</span></span></button>`}

function parseIng(line){
 const m=/^\s*((?:\d+[\d\/.,]*|½|¼|¾|⅓|a|an|one|two|three)\s*(?:x\s*)?(?:g|kg|ml|l|litre|litres|liter|oz|lb|lbs|tbsp|tsp|cups?|cans?|tins?|cloves?|bunch(?:es)?|handful|pinch|slices?|fillets?|punnets?|jars?|packs?|bottles?)?\b\.?)\s*(?:of\s+)?(.+)$/i.exec(line);
 let qty='',name=line.trim();if(m&&m[2]){qty=m[1].trim();name=m[2].trim()}
 else{const v=/^\s*((?:a\s+)?(?:small\s+|large\s+|big\s+)?(?:handful|bunch|pinch|sprig|few sprigs|splash|drizzle|dash)s?)\s+(?:of\s+)?(.+)$/i.exec(line);if(v){qty=v[1].trim().toLowerCase();name=v[2].trim()}}
 name=name.replace(/,.*$/,'').replace(/^(of )/i,'').trim();
 return {qty,name:name.charAt(0).toUpperCase()+name.slice(1)};
}
function addIngredients(recipes,label){
 takeSnapshot();let added=0,skipped=0,dup=0;
 const pantry=state.pantry.map(p=>p.name.toLowerCase());
 recipes.forEach(r=>r.ingredients.forEach(line=>{
  const {qty,name}=parseIng(line);if(!name)return;const key=name.toLowerCase();
  if(pantry.some(p=>p&&(p.includes(key)||key.includes(p)))){skipped++;return}
  const ex=state.shopping.find(i=>!i.done&&i.name.toLowerCase()===key);
  if(ex){if(qty&&!String(ex.qty).includes(qty))ex.qty=ex.qty?`${ex.qty} + ${qty}`:qty;dup++;return}
  state.shopping.push({id:uid(),name,qty,aisle:guessAisle(name),done:false,isSample:false});added++;
 }));
 commit();
 toast(`${added} item${added===1?'':'s'} added ${label}${dup?` · ${dup} merged`:''}${skipped?` · ${skipped} already in pantry`:''}`,'',restoreSnapshot);
}

/* ---------------- BALANCE ---------------- */

 const avg=calDays.length?Math.round(calDays.reduce((a,c)=>a+c,0)/calDays.length):0;
 const status=k=>{const g=GUIDES[k],v=b.tally[k];if(!g)return '';if(g.max!=null)return v<=g.max?'<span class="pill ok">On track</span>':'<span class="pill warn">A bit high</span>';return v>=g.min?'<span class="pill ok">On track</span>':`<span class="pill">${g.min-v} to go</span>`};
 const maxT=Math.max(4,...Object.values(b.tally));
 $('#page-balance').innerHTML=head('Balance','How this week’s plan lines up with a Mediterranean-style pattern.',`<div class="week-nav"><button class="btn icon" data-week="-1" aria-label="Previous week">${ic('left')}</button><strong>${weekLabel(ws)}</strong><button class="btn icon" data-week="1" aria-label="Next week">${ic('right')}</button></div>`)+`
 <div class="grid g4">
  <div class="card stat"><span class="k">${ic('leaf')}Plant-forward meals</span><span class="v">${b.plant}<small>%</small></span></div>
  <div class="card stat"><span class="k">${ic('fish')}Fish & seafood</span><span class="v">${b.tally.fish}<small> meals</small></span></div>
  <div class="card stat"><span class="k">${ic('jar')}Legume meals</span><span class="v">${b.tally.legumes}<small> meals</small></span></div>
  <div class="card stat"><span class="k">${ic('spark')}${state.settings.showCalories?'Avg calories / day':'Meals planned'}</span><span class="v">${state.settings.showCalories?(avg||'—'):b.total}${state.settings.showCalories&&avg?'<small> kcal</small>':''}</span></div>
 </div>
 <div class="grid g-main mt">
  <div class="card"><div class="card-h"><h3>Food groups this week</h3><span class="muted small">${b.total} meals</span></div>
   ${b.total?`<div class="list">${GROUPS.map(g=>`<div class="li"><span class="dot" style="background:${g.color}"></span><div class="grow"><div class="row" style="justify-content:space-between"><b style="font-weight:600">${g.label}</b><span class="small muted">${b.tally[g.k]} meal${b.tally[g.k]===1?'':'s'}${GUIDES[g.k]?` · ${GUIDES[g.k].txt}`:''}</span></div><div class="bar" style="margin-top:6px"><i style="width:${b.tally[g.k]/maxT*100}%;background:${g.color}"></i></div></div><div style="width:92px;text-align:right">${status(g.k)}</div></div>`).join('')}</div>`:emptyState('leaf','No meals this week yet','Plan a few meals and tag their food groups to see your balance.')}
  </div>

  </div>
 </div>`;
}

/* ---------------- data actions ---------------- */
function upsert(coll,obj){const i=state[coll].findIndex(x=>x.id===obj.id);if(i<0)state[coll].push(obj);else state[coll][i]={...state[coll][i],...obj};commit()}
function removeItem(coll,id,msg){const i=state[coll].findIndex(x=>x.id===id);if(i<0)return;const [old]=state[coll].splice(i,1);commit();toast(msg,'',()=>{state[coll].splice(Math.min(i,state[coll].length),0,old);commit()})}
async function clearSamples(){
 if(!await confirmBox('All example meals, recipes and lists will be removed. Anything you added yourself stays.',{title:'Clear sample data?',ok:'Clear samples'}))return;
 takeSnapshot();COLLECTIONS.forEach(k=>state[k]=state[k].filter(x=>!x.isSample));state.water={};state.settings.sampleCleared=true;commit();toast('Sample data cleared — it’s all yours now','',restoreSnapshot);
}
function loadSamples(){const smp=sampleState();takeSnapshot();COLLECTIONS.forEach(k=>state[k]=state[k].concat(smp[k]));state.settings.sampleCleared=false;commit();toast('Sample week loaded','',restoreSnapshot)}
async function eraseAll(){
 if(!await confirmBox('This permanently deletes every meal, recipe, list and note in this browser. Make a backup first if you might want them later.',{title:'Erase everything?',ok:'Erase everything',danger:true}))return;
 const keep={theme:state.settings.theme,accent:state.settings.accent};takeSnapshot();state=blankState();Object.assign(state.settings,keep,{onboarded:true,sampleCleared:true});applyTheme();commit();go('home');toast('Planner erased','',restoreSnapshot);
}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportBackup(){state.settings.lastBackup=new Date().toISOString();state.ui.backupSnooze=null;download(`mediterranean-meal-planner-backup-${today()}.json`,JSON.stringify({app:'mediterranean-meal-planner',version:2,exportedAt:new Date().toISOString(),state},null,1),'application/json');commit();toast('Backup saved to your downloads')}
function exportCSV(){
 const q=v=>`"${String(v??'').replace(/"/g,'""')}"`,rows=[['Type','Date','Meal / Category','Title','Calories','Status / Qty','Details']];
 state.meals.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>rows.push(['Meal',m.date,m.slot,m.title,m.calories,m.status,(m.groups||[]).map(k=>G[k]?.label).join('; ')]));
 state.recipes.forEach(r=>rows.push(['Recipe','',r.category,r.title,r.calories,'',r.ingredients.join('; ')]));
 state.shopping.forEach(i=>rows.push(['Shopping','',i.aisle,i.name,'',i.qty,i.done?'Bought':'To buy']));
 state.pantry.forEach(i=>rows.push(['Pantry',i.expiry,i.aisle,i.name,'',i.qty,'']));
 state.tasks.forEach(t=>rows.push(['Prep task',t.date,t.priority,t.title,'',t.status,'']));
 download(`mediterranean-meal-planner-${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');toast('CSV exported — opens in Excel, Numbers or Sheets');
}
function importBackup(file){
 if(!file)return;if(file.size>60*1024*1024){toast('That file is too large to be a backup','err');return}
 const rd=new FileReader();rd.onload=async()=>{try{const x=migrate(JSON.parse(rd.result));const n=COLLECTIONS.reduce((a,k)=>a+x[k].length,0);
  if(!await confirmBox(`This backup has ${n} items. Restoring replaces what’s in this browser now.`,{title:'Restore backup?',ok:'Restore'}))return;
  takeSnapshot();x.settings.onboarded=true;state=x;applyTheme();await flush();go('home');toast('Backup restored','',restoreSnapshot)}catch(e){toast(e.message.includes('Mediterranean Meal Planner')?e.message:'That file couldn’t be read as a backup.','err')}};
 rd.onerror=()=>toast('Couldn’t read that file','err');rd.readAsText(file);
}

/* ---------------- print ---------------- */
function printHead(title){return `<div class="print-head" style="display:none"><svg viewBox="0 0 270 64" aria-hidden="true"><g transform="scale(1)"><rect width="64" height="64" rx="16" fill="#1D5673"/>${MARK_INNER}</g><g transform="translate(76 14) scale(1)" fill="#1E2A30"><path d="${WM_D}"/></g></svg><div style="text-align:right"><b class="serif" style="font-size:16px">${esc(title)}</b><br><span class="small muted">${esc(state.profile.plannerName)}</span></div></div>`}
function doPrint(kind,orient){
 document.body.dataset.print=kind;let st=$('#pageOrient');if(!st){st=document.createElement('style');st.id='pageOrient';document.head.appendChild(st)}
 st.textContent=`@page{size:${orient};margin:12mm}`;
 const done=()=>{delete document.body.dataset.print;st.textContent='';window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);setTimeout(()=>window.print(),60);setTimeout(done,60000);
}
function printWeek(){if(state.ui.page!=='week')go('week');doPrint('week','landscape')}
function printShopping(){if(state.ui.page!=='shopping')go('shopping');doPrint('shopping','portrait')}
function printRecipe(r){
 $('#printRecipe').innerHTML=printHead(r.title)+`<div class="rdetail"><img class="img" style="max-height:240px" src="${recipeImg(r)}" alt=""><div class="meta">${[r.category,r.time&&r.time+' min',r.servings&&'Serves '+r.servings,kcal(r.calories)].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="grid g2" style="gap:24px"><div><h4>Ingredients</h4><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div><div><h4>Method</h4><ol>${(r.method||'').split('\n').filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div></div>`;
 closeModal();doPrint('recipe','portrait');
}

/* ---------------- onboarding ---------------- */
function onboarding(step=0){
 const steps=[
  ()=>`<div class="onb"><svg class="big" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--primary)"/>${MARK_INNER}</svg><h2>Welcome to Mediterranean Meal Planner</h2><p>Your Mediterranean meal planner. Plan the week, keep your recipes, and turn meals into a shopping list in one tap.</p><div class="field" style="max-width:320px;margin:0 auto;text-align:left"><label for="oName">What should we call you? <span class="hint">(optional)</span></label><input id="oName" value="${esc(state.profile.name)}" placeholder="First name" autocomplete="given-name"></div></div>`,
  ()=>`<div class="onb"><h2>How saving works</h2><p>Mediterranean Meal Planner saves as you go. Everything stays private on this device — there’s no account and nothing is uploaded.</p><div class="tips">
   <div>${ic('shield')}<span><b>Use the same browser each time.</b> Your plans are saved in the browser you’re using now${location.protocol==='file:'?', for this file in its current folder. If you move the file, restore a backup':''}.</span></div>
   <div>${ic('down')}<span><b>Back up once a week.</b> Settings → Back up now saves a small file you can restore any time, on any device.</span></div>
   <div>${ic('heart')}<span><b>Bookmark this page</b> so it’s one click away.</span></div></div></div>`,
  ()=>`<div class="onb"><h2>How would you like to start?</h2><p>You can change your mind later in Settings.</p><div class="choice" id="oStart"><button class="on" data-v="sample"><b>Explore a sample week</b><span>See Mediterranean Meal Planner filled with meals, recipes and a shopping list.</span></button><button data-v="blank"><b>Start with a blank planner</b><span>Jump straight in with your own meals.</span></button></div></div>`
 ];
 const last=step===steps.length-1;
 const m=openModal({title:'<span class="sr-only">Welcome</span>',size:'',body:steps[step]()+`<div class="steps">${steps.map((_,i)=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>`,
  buttons:[...(step?[{label:'Back',onClick:()=>{setTimeout(()=>onboarding(step-1),10)}}]:[]),{label:last?'Start planning':'Next',cls:'primary',onClick:m=>{
   if(step===0)state.profile.name=$('#oName',m).value.trim();
   if(last){const v=$('#oStart .on',m)?.dataset.v;state.settings.onboarded=true;if(v==='blank'&&hasSamples()){COLLECTIONS.forEach(k=>state[k]=state[k].filter(x=>!x.isSample));state.water={};state.settings.sampleCleared=true}commit();go('home');toast(v==='blank'?'All set — add your first meal':'Enjoy exploring!')}
   else setTimeout(()=>onboarding(step+1),10);
  }}],onClose:()=>{if(!state.settings.onboarded){state.settings.onboarded=true;save()}}});
 $$('#oStart button',m).forEach(b=>b.onclick=()=>{$$('#oStart button',m).forEach(x=>x.classList.remove('on'));b.classList.add('on')});
}

/* ---------------- diagnostics ---------------- */
async function diagnostics(){
 const r=[];const ok=(n,v)=>r.push([n,!!v]);
 try{const d=new Date(2026,0,31);ok('Dates use your local time',ymd(d)==='2026-01-31'&&addDays('2026-01-31',1)==='2026-02-01')}catch(e){ok('Dates use your local time',false)}
 ok('Week has 7 days',weekDays(curWeekStart()).length===7);
 try{await Store.set('__probe',Date.now());ok('Saving works ('+Store.mode+')',Store.mode!=='memory')}catch(e){ok('Saving works',false)}
 try{ok('Backup can be created',JSON.parse(JSON.stringify({app:'mediterranean-meal-planner',state})).app==='mediterranean-meal-planner')}catch(e){ok('Backup can be created',false)}
 try{ok('Backup can be restored',migrate(JSON.parse(JSON.stringify({app:'mediterranean-meal-planner',state}))).version===2)}catch(e){ok('Backup can be restored',false)}
 try{const c=document.createElement('canvas');ok('Photo resizing available',!!c.getContext('2d')&&c.toDataURL('image/jpeg').startsWith('data:image/jpeg'))}catch(e){ok('Photo resizing available',false)}
 ok('All pages present',PAGES.every(p=>$('#page-'+p[0])));
 ok('Shopping aisles sort correctly',guessAisle('Cherry tomatoes')==='Produce'&&guessAisle('Feta')==='Dairy & Eggs');
 const pass=r.every(x=>x[1]);
 openModal({title:pass?'Everything looks good':'Some checks need attention',size:'narrow',body:`<div class="list">${r.map(([n,v])=>`<div class="li"><div class="grow">${esc(n)}</div><span class="pill ${v?'ok':'bad'}">${v?'Pass':'Check'}</span></div>`).join('')}</div>${pass?'':'<p class="small muted">If saving fails, open the planner directly in Chrome, Safari, Edge or Firefox instead of a preview window.</p>'}`,buttons:[{label:'Close',cls:'primary'}]});
}

/* ---------------- event delegation ---------------- */
const ACTIONS={menu:openSidebar,toggleTheme:()=>{state.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();commit()},quickAdd,
 addMeal:()=>mealModal({}),addRecipe:()=>recipeModal(),addTask:()=>taskModal(),addGoal:()=>goalModal(),addNote:()=>noteModal(),addPantry:()=>pantryModal(),water:()=>addWater(1),
 genShopping,copyWeek,clearWeek,printWeek,printShopping,copyList,clearSamples,loadSamples,eraseAll,exportBackup,exportCSV,importBackup:()=>$('#importFile').click(),onboarding:()=>onboarding(0),diagnostics,
 snoozeBackup:()=>{state.ui.backupSnooze=addDays(today(),3);commit()},
 clearBought:()=>{takeSnapshot();const n=state.shopping.filter(i=>i.done).length;state.shopping=state.shopping.filter(i=>!i.done);commit();toast(`Cleared ${n} bought item${n===1?'':'s'}`,'',restoreSnapshot)},
 clearDone:()=>{takeSnapshot();state.tasks=state.tasks.filter(t=>t.status!=='Done');commit();toast('Finished tasks cleared','',restoreSnapshot)}};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action],[data-go],[data-meal],[data-add-meal],[data-week],[data-month],[data-recipe],[data-fav],[data-rfilter],[data-shopedit],[data-del],[data-restock],[data-pantryedit],[data-taskedit],[data-goal],[data-goaledit],[data-day],[data-noteedit],[data-glass],[data-accent]');
 if(!el)return;const d=el.dataset;
 if(d.action){ACTIONS[d.action]?.();return}
 if(d.go){e.preventDefault();if($('#overlay').classList.contains('open'))closeModal();go(d.go);return}
 if(d.meal){if($('#overlay').classList.contains('open'))closeModal();setTimeout(()=>mealModal({id:d.meal}),10);return}
 if(d.addMeal){const [date,slot]=d.addMeal.split('|');if($('#overlay').classList.contains('open'))closeModal();setTimeout(()=>mealModal({date,slot}),10);return}
 if(d.week!=null){state.ui.weekOffset=d.week==='0'?0:state.ui.weekOffset+(+d.week);commit();return}
 if(d.month!=null){if(d.month==='0'){state.ui.calMonth=new Date().getMonth();state.ui.calYear=new Date().getFullYear()}else{let mo=state.ui.calMonth+(+d.month),y=state.ui.calYear;if(mo<0){mo=11;y--}if(mo>11){mo=0;y++}state.ui.calMonth=mo;state.ui.calYear=y}commit();return}
 if(d.fav){const r=state.recipes.find(x=>x.id===d.fav);if(r){r.fav=!r.fav;commit()}return}
 if(d.recipe){recipeDetail(d.recipe);return}
 if(d.rfilter){state.ui.recipeFilter=d.rfilter;commit();return}
 if(d.shopedit){shopModal(d.shopedit);return}
 if(d.del){const [c,id]=d.del.split('|');removeItem(c,id,'Item removed');return}
 if(d.restock){const p=state.pantry.find(x=>x.id===d.restock);if(p){state.shopping.push({id:uid(),name:p.name,qty:'',aisle:p.aisle,done:false,isSample:false});commit();toast(`${p.name} added to shopping`)}return}
 if(d.pantryedit){pantryModal(d.pantryedit);return}
 if(d.taskedit){if($('#overlay').classList.contains('open'))closeModal();setTimeout(()=>taskModal(d.taskedit),10);return}
 if(d.goal){const [id,n]=d.goal.split('|');const g=state.goals.find(x=>x.id===id);if(g){g.progress=clamp((+g.progress||0)+(+n),0,100);commit();if(g.progress===100)toast('Goal reached — well done! 🎉')}return}
 if(d.goaledit){goalModal(d.goaledit);return}
 if(d.day){dayModal(d.day);return}
 if(d.noteedit){noteModal(d.noteedit);return}
 if(d.glass){const t=today(),n=+d.glass,cur=+state.water[t]||0;state.water[t]=n===cur?n-1:n;commit();return}
 if(d.accent){state.settings.accent=d.accent;applyTheme();commit();return}
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.shop){const i=state.shopping.find(x=>x.id===d.shop);if(i){i.done=e.target.checked;commit()}}
 else if(d.task){const t=state.tasks.find(x=>x.id===d.task);if(t){t.status=e.target.checked?'Done':'Open';commit();if(t.status==='Done')toast('Nice — task done','',()=>{t.status='Open';commit()})}}
 else if(d.eat){const m=state.meals.find(x=>x.id===d.eat);if(m){m.status=e.target.checked?'Eaten':'Planned';commit()}}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-recipe],[role=button][data-noteedit]')){e.preventDefault();e.target.click()}});

/* ---------------- boot ---------------- */
async function boot(){
 $('#menuBtn').innerHTML=ic('menu');$('#quickBtn').innerHTML=`${ic('plus')}<span class="hide-sm">Quick add</span>`;
 await Store.init();
 let saved;try{saved=await Store.get('state')}catch(e){}
 if(!saved&&Store.mode==='idb'){try{const raw=localStorage.getItem('mediterranean-meal-planner:state');if(raw)saved=JSON.parse(raw)}catch(e){}}
 try{state=saved?migrate(saved):sampleState()}catch(e){state=sampleState()}
 applyTheme();
 const h=(location.hash.match(/^#\/(\w+)/)||[])[1];
 go(h||state.ui.page||'home',{push:false});
 if(!saved)await flush();
 if(!state.settings.onboarded)setTimeout(()=>onboarding(0),250);
 // Installable app when hosted online (service workers can't run from a downloaded file)
 if(/^https?:$/.test(location.protocol)){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 }
 setInterval(()=>{if(state.ui.page==='home'||state.ui.page==='today'){const d=today();if(d!==boot.day){boot.day=d;refresh()}}},60000);boot.day=today();
}
boot();

</script>
